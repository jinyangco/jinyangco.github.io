    </g>
    <text class="cls-13" transform="translate(197.63 287.55)"><tspan x="0" y="0">식하우스 증후군으로 개인차가 있지만, 일반적으로 두통, 구역질, 눈과 목의 통증,</tspan><tspan x="0" y="17">가래, 가려움, 설사, 변비, 아토피성 피부염, 천식, 불안, 초조, 만성피로, 불면 등 </tspan><tspan x="0" y="34">건강장애가 나타나며, 매년 고통받는 사람들이 급증하고 있습니다.</tspan></text>
    <text class="cls-3" transform="translate(195.72 266.65)"><tspan x="0" y="0">주요 증상</tspan></text>
  </g>
  <g>
