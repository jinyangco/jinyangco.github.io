  <text class="cls-13" transform="translate(98.8 49.21)"><tspan x="0" y="0">실내의 건축자재나 가구, 생활용품에서 나오는 유해물질의 농도가 건강을 해칠</tspan><tspan x="0" y="17">정도로 높은 집을 말합니다.</tspan><tspan x="0" y="34">새 집의 경우 무늬목에서 발생되는 프롬알데히드, 마루판 접착제에서 발생되는</tspan><tspan x="0" y="51">유독물질 등 밀폐성성과 단열성이 높은 특정자재물의 화학물질이 다량으로 들어간</tspan><tspan x="0" y="68">건축자재로부터 휘발성 유기화합물(VOCs)이 발생합니다.</tspan></text>
  <text class="cls-3" transform="translate(96.9 28.31)"><tspan x="0" y="0">Sick House </tspan><tspan class="cls-12" x="78.33" y="0">S</tspan><tspan class="cls-11" x="85.88" y="0">ynd</tspan><tspan class="cls-10" x="110.66" y="0">r</tspan><tspan class="cls-5" x="116.1" y="0">ome (새집증후군)</tspan></text>
  <text class="cls-13" transform="translate(243.63 198.55)"><tspan x="0" y="0">학교 건물에서 발생되는 휘발성 유기화합물(VOCs)의 과다한 영향으로</tspan><tspan x="0" y="17">화학물질 과민증 환자가 발생할 수 있습니다.</tspan></text>
  <text class="cls-3" transform="translate(240.72 170.65)"><tspan x="0" y="0">Sickk School </tspan><tspan class="cls-12" x="88.41" y="0">S</tspan><tspan class="cls-11" x="95.96" y="0">ynd</tspan><tspan class="cls-10" x="120.74" y="0">r</tspan><tspan class="cls-5" x="126.18" y="0">ome (학교증후군)</tspan></text>
